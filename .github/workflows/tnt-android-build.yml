name: TNT Android Build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "libs/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/tnt-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tnt-android-build-main
  cancel-in-progress: true

jobs:
  build:
    name: Build TNT Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TNT-android-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
