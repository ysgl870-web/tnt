name: TNT Next Android Build

on:
  push:
    branches:
      - "tnt-next/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TNT APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease --warning-mode all --stacktrace
      - name: Upload TNT APK
        uses: actions/upload-artifact@v4
        with:
          name: tnt-next-release-apk
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error
          retention-days: 14
