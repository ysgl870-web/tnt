name: Android CI

on:
  push:
    branches: [ main, "tnt-next/ono-base" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'renovate.json'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'renovate.json'
      - '.editorconfig'
      - '.gitignore'
      - '.github/**'
      - '.github/workflows/**'
      - '.idea/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/tnt-next/ono-base' || github.event_name == 'pull_request') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode and validate release keystore (main)
        id: keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: key0
        run: |
          set -euo pipefail
          mkdir -p app
          rm -f app/ono.jks
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo "::warning::KEYSTORE_B64 is empty; using the Android debug signing key for this CI artifact."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > app/ono.jks 2>/dev/null; then
            rm -f app/ono.jks
            echo "::warning::KEYSTORE_B64 is not valid base64; using debug signing for this CI artifact."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -s app/ono.jks ]] || ! keytool -list -keystore app/ono.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f app/ono.jks
            echo "::warning::Release keystore is unreadable or alias/password is invalid; using debug signing for this CI artifact."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore validated successfully."

      - name: Build unsigned Release for PR
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Build signed Release for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.keystore.outputs.valid == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE=ono.jks \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS=key0 \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            --warning-mode all --stacktrace

      - name: Build Release with debug signing fallback (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.keystore.outputs.valid != 'true'
        run: |
          echo "::warning::Building a test Release variant signed with the Android debug key."
          ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Build Release for tnt-next/ono-base
        if: github.event_name == 'push' && github.ref == 'refs/heads/tnt-next/ono-base'
        run: |
          echo "Building the TNT development branch with the Android debug key."
          ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Upload PR APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tnt-pr-apk
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

      - name: Upload Release APK (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ono-release-apk
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

      - name: Upload TNT development APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/tnt-next/ono-base'
        uses: actions/upload-artifact@v4
        with:
          name: tnt-next-apk
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

  upload-telegram:
    name: Upload to Telegram (仅 main push)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ono-release-apk
          path: artifacts

      - name: Find APK file
        id: find_apk
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/**/*.apk artifacts/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APK found!" >&2
            exit 1
          fi
          echo "apk_path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Send APK via Telegram API
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Sending $APK_PATH"
          commit_url="https://github.com/${REPO}/commit/${SHA}"
          caption="🎉 *检测到新的 GitHub 推送！*
          *Commit SHA:* \`${SHA}\`
          
          \`\`\`
          ${COMMIT_MSG}
          \`\`\`
          
          *提交者* \`${COMMIT_AUTHOR}\`
          [查看详情](${commit_url})"
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${APK_PATH}" \
            -F caption="${caption}" \
            -F parse_mode=Markdown
